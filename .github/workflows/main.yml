name: Python-Test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'  # Specify your desired Python version here

      - name: Run unit tests
        run: |
          python -m unittest discover -s . -p "test_*.py"

  deploy:
    runs-on: ubuntu-latest
    needs: test #이게 우선순위 강제하는 것. deploy 실행 위해서는 test가 선행되어야 한다는 뜻.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run main.py
        run: python main.py

